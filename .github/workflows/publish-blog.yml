name: Publish weekly CRE insight

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-blog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI
        run: python -m pip install --upgrade openai

      - name: Generate article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python blog/_automation/generate_article.py

      - name: Commit article
        run: |
          git config user.name "Valcrest SEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog
          git commit -m "Publish weekly Valcrest insight" || exit 0
          git push
